# LOADED capture — python-netbox (PROVE plan, phase 0 → 1 gate, added 2026-09-26).
#
# Python APPLICATION cell, never attempted in Phase 0. Declared environment copied from ci.yml: ubuntu-latest,
# Python 3.12 (first of the matrix), Postgres + Redis services, NETBOX_CONFIGURATION=netbox.configuration_testing,
# `python netbox/manage.py test netbox/ --parallel`.
#
# TWO recorders, one run: the product recorder (engine recorders/python/sitecustomize.py) first on PYTHONPATH,
# the harness shim second. The product recorder chain-loads the next sitecustomize, so the same test run
# yields the product's LOADED and the harness's independent view. `--parallel` forks workers: exactly the
# per-process case both are written for.
name: LOADED capture — netbox
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to measure. Defaults to the corpus pin.
        required: false
        default: 'depproof-pinned'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NETBOX_CONFIGURATION: netbox.configuration_testing
    services:
      redis:
        image: redis
        ports: ['6379:6379']
      postgres:
        image: postgres
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tblib
      - run: python netbox/manage.py collectstatic --no-input
      - name: Write both recorders
        run: |
          mkdir -p rec/product rec/harness traces/product traces/harness
          echo '' | base64 -d > rec/product/sitecustomize.py
          echo '' | base64 -d > rec/harness/sitecustomize.py
          wc -l rec/*/sitecustomize.py
      - name: Tests, traced
        env:
          PYTHONPATH: ${{ github.workspace }}/rec/product:${{ github.workspace }}/rec/harness
          DEPPROOF_BEHAVIOUR_DIR: ${{ github.workspace }}/traces/product
          DEPPROOF_TRACE_DIR: ${{ github.workspace }}/traces/harness
        run: |
          python netbox/manage.py test netbox/ --parallel \
            || echo "suite exited $? — a partial suite still yields a valid trace"
      - name: Canary — both recorders wrote
        run: |
          p=$(ls traces/product/behaviour-*.json 2>/dev/null | wc -l)
          h=$(ls traces/harness/python-*.txt 2>/dev/null | wc -l)
          echo "product: $p process files; harness: $h process files"
          [ "$p" -ge 1 ] && [ "$h" -ge 1 ] || { echo "::error::a recorder wrote nothing"; exit 1; }
      - name: The installed set, for the local scan
        if: always()
        run: pip freeze > installed.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loaded-netbox
          path: |
            traces/
            installed.txt
          retention-days: 30
